name: Build and publish BC-250 CachyOS kernels and Mesa packages

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all kernels and Mesa components even when fingerprints are unchanged
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '23 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-release.yml'
      - 'patches/**'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: bc250-repository-release
  cancel-in-progress: false

jobs:
  build:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - bc250

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Ensure gh CLI is available
        # The ghcr.io/actions/actions-runner base image does not ship gh.
        # Installed on the runner's own Ubuntu base, not the ephemeral build
        # container, so this is a no-op once it's present. This must run before
        # any step that queries the release, not just before publishing: the
        # cache decision and the repository seeding both depend on gh.
        shell: bash
        run: |
          set -euo pipefail
          command -v gh >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gh
          }

      - name: Resolve nct6687d source
        id: nct6687d
        shell: bash
        env:
          NCT6687D_REF: ${{ vars.NCT6687D_REF }}
        run: |
          set -euo pipefail
          commit="$(./scripts/resolve-nct6687d.sh)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Using nct6687d commit: $commit"

      - name: Resolve CachyOS Mesa packaging source
        id: mesa_packaging
        shell: bash
        env:
          CACHYOS_MESA_REF: ${{ vars.CACHYOS_MESA_REF }}
        run: |
          set -euo pipefail
          commit="$(./scripts/resolve-cachyos-mesa.sh)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Using CachyOS-PKGBUILDS commit: $commit"

      - name: Resolve Mesa Git source
        id: mesa_git
        shell: bash
        env:
          MESA_GIT_REF: ${{ vars.MESA_GIT_REF }}
        run: |
          set -euo pipefail
          commit="$(./scripts/resolve-mesa-git.sh)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Using Mesa main commit: $commit"

      - name: Calculate component fingerprints
        id: fingerprints
        shell: bash
        env:
          NCT6687D_COMMIT: ${{ steps.nct6687d.outputs.commit }}
          CACHYOS_MESA_COMMIT: ${{ steps.mesa_packaging.outputs.commit }}
          MESA_GIT_COMMIT: ${{ steps.mesa_git.outputs.commit }}
        run: |
          set -euo pipefail

          kernel_stable="$(./scripts/source-fingerprint.sh kernel-stable)"
          kernel_rc="$(./scripts/source-fingerprint.sh kernel-rc)"
          kernel_bore="$(./scripts/source-fingerprint.sh kernel-bore)"
          mesa="$(./scripts/source-fingerprint.sh mesa)"
          lib32_mesa="$(./scripts/source-fingerprint.sh lib32-mesa)"
          mesa_git="$(./scripts/source-fingerprint.sh mesa-git)"
          mesa_testing="$(./scripts/source-fingerprint.sh mesa-testing)"
          lib32_mesa_testing="$(./scripts/source-fingerprint.sh lib32-mesa-testing)"
          bc250_dual_audio="$(./scripts/source-fingerprint.sh bc250-dual-audio)"
          linux_cachyos_bc250_meta="$(./scripts/source-fingerprint.sh linux-cachyos-bc250-meta)"
          aggregate="$(printf '%s\n' \
            "$kernel_stable" "$kernel_rc" "$kernel_bore" \
            "$mesa" "$lib32_mesa" "$mesa_git" \
            "$mesa_testing" "$lib32_mesa_testing" "$bc250_dual_audio" \
            "$linux_cachyos_bc250_meta" | sha256sum | awk '{print $1}')"

          echo "kernel_stable=$kernel_stable" >> "$GITHUB_OUTPUT"
          echo "kernel_rc=$kernel_rc" >> "$GITHUB_OUTPUT"
          echo "kernel_bore=$kernel_bore" >> "$GITHUB_OUTPUT"
          echo "mesa=$mesa" >> "$GITHUB_OUTPUT"
          echo "lib32_mesa=$lib32_mesa" >> "$GITHUB_OUTPUT"
          echo "mesa_git=$mesa_git" >> "$GITHUB_OUTPUT"
          echo "mesa_testing=$mesa_testing" >> "$GITHUB_OUTPUT"
          echo "lib32_mesa_testing=$lib32_mesa_testing" >> "$GITHUB_OUTPUT"
          echo "bc250_dual_audio=$bc250_dual_audio" >> "$GITHUB_OUTPUT"
          echo "linux_cachyos_bc250_meta=$linux_cachyos_bc250_meta" >> "$GITHUB_OUTPUT"
          echo "aggregate=$aggregate" >> "$GITHUB_OUTPUT"

          printf 'Stable kernel fingerprint: %s\n' "$kernel_stable"
          printf 'RC kernel fingerprint:     %s\n' "$kernel_rc"
          printf 'BORE kernel fingerprint:   %s\n' "$kernel_bore"
          printf 'Mesa fingerprint:          %s\n' "$mesa"
          printf 'lib32-mesa fingerprint:    %s\n' "$lib32_mesa"
          printf 'mesa-git fingerprint:      %s\n' "$mesa_git"
          printf 'mesa-testing fingerprint:  %s\n' "$mesa_testing"
          printf 'lib32-mesa-testing fp:     %s\n' "$lib32_mesa_testing"
          printf 'bc250-dual-audio fp:       %s\n' "$bc250_dual_audio"
          printf 'linux-cachyos-bc250-meta fp: %s\n' "$linux_cachyos_bc250_meta"

      - name: Determine components to build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_STABLE_FINGERPRINT: ${{ steps.fingerprints.outputs.kernel_stable }}
          KERNEL_RC_FINGERPRINT: ${{ steps.fingerprints.outputs.kernel_rc }}
          KERNEL_BORE_FINGERPRINT: ${{ steps.fingerprints.outputs.kernel_bore }}
          MESA_FINGERPRINT: ${{ steps.fingerprints.outputs.mesa }}
          LIB32_MESA_FINGERPRINT: ${{ steps.fingerprints.outputs.lib32_mesa }}
          MESA_GIT_FINGERPRINT: ${{ steps.fingerprints.outputs.mesa_git }}
          MESA_TESTING_FINGERPRINT: ${{ steps.fingerprints.outputs.mesa_testing }}
          LIB32_MESA_TESTING_FINGERPRINT: ${{ steps.fingerprints.outputs.lib32_mesa_testing }}
          BC250_DUAL_AUDIO_FINGERPRINT: ${{ steps.fingerprints.outputs.bc250_dual_audio }}
          LINUX_CACHYOS_BC250_META_FINGERPRINT: ${{ steps.fingerprints.outputs.linux_cachyos_bc250_meta }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf previous
          mkdir -p previous
          info=previous/build-info.env

          # Never let a transient GitHub/network failure look like "nothing has
          # ever been built": that silently rebuilds every component.
          if ! state="$(./scripts/gh-release-state.sh repo)"; then
            echo "::error title=Cannot reach GitHub releases::Refusing to treat this as a first build and rebuild every component. Re-run once connectivity is back."
            exit 1
          fi

          if [[ "$state" == missing ]]; then
            echo "No previous release published yet; every component counts as changed."
            : > "$info"
          else
            # Any release this workflow publishes contains build-info.env (the
            # publish step verifies it), so if the release exists and the asset
            # will not download, that is an error rather than a missing cache.
            downloaded=false
            for attempt in 1 2 3 4 5; do
              if gh release download repo --pattern build-info.env --dir previous --clobber >/dev/null 2>&1; then
                downloaded=true
                break
              fi
              echo "WARN: build-info.env download failed (attempt $attempt/5)"
              if (( attempt < 5 )); then sleep $(( attempt * 10 )); fi
            done
            if [[ "$downloaded" != true ]]; then
              echo "::error title=Cannot read previous build fingerprints::The repo release exists but build-info.env could not be downloaded. Refusing to silently rebuild every component."
              exit 1
            fi
          fi

          previous_value() {
            sed -n "s/^$1=//p" "$info" | head -n1
          }

          build_kernel_stable=false
          build_kernel_rc=false
          build_kernel_bore=false
          build_mesa=false
          build_lib32_mesa=false
          build_mesa_git=false
          build_mesa_testing=false
          build_lib32_mesa_testing=false
          build_bc250_dual_audio=false
          build_linux_cachyos_bc250_meta=false

          [[ "$(previous_value KERNEL_STABLE_FINGERPRINT)" == "$KERNEL_STABLE_FINGERPRINT" ]] || build_kernel_stable=true
          [[ "$(previous_value KERNEL_RC_FINGERPRINT)" == "$KERNEL_RC_FINGERPRINT" ]] || build_kernel_rc=true
          [[ "$(previous_value KERNEL_BORE_FINGERPRINT)" == "$KERNEL_BORE_FINGERPRINT" ]] || build_kernel_bore=true
          [[ "$(previous_value MESA_FINGERPRINT)" == "$MESA_FINGERPRINT" ]] || build_mesa=true
          [[ "$(previous_value LIB32_MESA_FINGERPRINT)" == "$LIB32_MESA_FINGERPRINT" ]] || build_lib32_mesa=true
          [[ "$(previous_value MESA_GIT_FINGERPRINT)" == "$MESA_GIT_FINGERPRINT" ]] || build_mesa_git=true
          [[ "$(previous_value MESA_TESTING_FINGERPRINT)" == "$MESA_TESTING_FINGERPRINT" ]] || build_mesa_testing=true
          [[ "$(previous_value LIB32_MESA_TESTING_FINGERPRINT)" == "$LIB32_MESA_TESTING_FINGERPRINT" ]] || build_lib32_mesa_testing=true
          [[ "$(previous_value BC250_DUAL_AUDIO_FINGERPRINT)" == "$BC250_DUAL_AUDIO_FINGERPRINT" ]] || build_bc250_dual_audio=true
          [[ "$(previous_value LINUX_CACHYOS_BC250_META_FINGERPRINT)" == "$LINUX_CACHYOS_BC250_META_FINGERPRINT" ]] || build_linux_cachyos_bc250_meta=true

          if [[ '${{ github.event_name }}' == workflow_dispatch && '${{ inputs.force }}' == true ]]; then
            build_kernel_stable=true
            build_kernel_rc=true
            build_kernel_bore=true
            build_mesa=true
            build_lib32_mesa=true
            build_mesa_git=true
            build_mesa_testing=true
            build_lib32_mesa_testing=true
            build_bc250_dual_audio=true
            build_linux_cachyos_bc250_meta=true
          fi

          any=false
          if [[ "$build_kernel_stable" == true || "$build_kernel_rc" == true || \
                "$build_kernel_bore" == true || "$build_mesa" == true || \
                "$build_lib32_mesa" == true || "$build_mesa_git" == true || \
                "$build_mesa_testing" == true || "$build_lib32_mesa_testing" == true || \
                "$build_bc250_dual_audio" == true || "$build_linux_cachyos_bc250_meta" == true ]]; then
            any=true
          fi

          echo "kernel_stable=$build_kernel_stable" >> "$GITHUB_OUTPUT"
          echo "kernel_rc=$build_kernel_rc" >> "$GITHUB_OUTPUT"
          echo "kernel_bore=$build_kernel_bore" >> "$GITHUB_OUTPUT"
          echo "mesa=$build_mesa" >> "$GITHUB_OUTPUT"
          echo "lib32_mesa=$build_lib32_mesa" >> "$GITHUB_OUTPUT"
          echo "mesa_git=$build_mesa_git" >> "$GITHUB_OUTPUT"
          echo "mesa_testing=$build_mesa_testing" >> "$GITHUB_OUTPUT"
          echo "lib32_mesa_testing=$build_lib32_mesa_testing" >> "$GITHUB_OUTPUT"
          echo "bc250_dual_audio=$build_bc250_dual_audio" >> "$GITHUB_OUTPUT"
          echo "linux_cachyos_bc250_meta=$build_linux_cachyos_bc250_meta" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"

          echo "Build stable kernel: $build_kernel_stable"
          echo "Build RC kernel:     $build_kernel_rc"
          echo "Build BORE kernel:   $build_kernel_bore"
          echo "Build Mesa:          $build_mesa"
          echo "Build lib32-mesa:    $build_lib32_mesa"
          echo "Build mesa-git:      $build_mesa_git"
          echo "Build mesa-testing:  $build_mesa_testing"
          echo "Build lib32-mesa-testing: $build_lib32_mesa_testing"
          echo "Build bc250-dual-audio:   $build_bc250_dual_audio"
          echo "Build linux-cachyos-bc250-meta: $build_linux_cachyos_bc250_meta"

      - name: Seed previous repository
        if: steps.build.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/repo
          mkdir -p out/repo

          # As above: an unreachable API must not look like "no release yet".
          # The publish step deletes and recreates the release from out/repo, so
          # seeding from nothing would drop every package not rebuilt this run.
          if ! state="$(./scripts/gh-release-state.sh repo)"; then
            echo "::error title=Cannot reach GitHub releases::Refusing to seed from nothing, which would drop existing packages from the published repository."
            exit 1
          fi

          if [[ "$state" == found ]]; then
            downloaded=false
            for attempt in 1 2 3 4 5; do
              if gh release download repo --dir out/repo --clobber; then
                downloaded=true
                break
              fi
              echo "WARN: release download failed (attempt $attempt/5)"
              if (( attempt < 5 )); then sleep $(( attempt * 10 )); fi
            done
            if [[ "$downloaded" != true ]]; then
              echo "::error title=Cannot preserve existing packages::The previous fixed repo release exists, but it could not be downloaded."
              exit 1
            fi
            echo "Seeded out/repo from the previous fixed release."
          else
            echo "No previous fixed release exists; starting a new repository."
          fi

          # Remove auxiliary assets from the old single-kernel architecture.
          # Package files themselves are left alone; the stable builder removes
          # the old linux-cachyos-bc250 pkgbase via .PKGINFO before replacing it.
          rm -f -- \
            out/repo/.SRCINFO out/repo/kernel.SRCINFO out/repo/kernel-info.env \
            out/repo/PKGBUILD out/repo/config \
            out/repo/0001-bc250-8core-telemetry-gpu-activity.patch \
            out/repo/0002-bc250-audio.patch \
            out/repo/0003-nct6687d-hwmon.patch \
            out/repo/0004-gfx1013-pasid-tlb-invalidation.patch \
            out/repo/0005-gfx1013-compute-gfxoff-guard.patch

          echo "Existing package artifacts will be preserved unless their .PKGINFO pkgbase is rebuilt."

      - name: Build changed Zen 2-tuned packages
        if: steps.build.outputs.any == 'true'
        env:
          SOURCE_FINGERPRINT: ${{ steps.fingerprints.outputs.aggregate }}
          KERNEL_STABLE_FINGERPRINT: ${{ steps.fingerprints.outputs.kernel_stable }}
          KERNEL_RC_FINGERPRINT: ${{ steps.fingerprints.outputs.kernel_rc }}
          KERNEL_BORE_FINGERPRINT: ${{ steps.fingerprints.outputs.kernel_bore }}
          MESA_FINGERPRINT: ${{ steps.fingerprints.outputs.mesa }}
          LIB32_MESA_FINGERPRINT: ${{ steps.fingerprints.outputs.lib32_mesa }}
          MESA_GIT_FINGERPRINT: ${{ steps.fingerprints.outputs.mesa_git }}
          MESA_TESTING_FINGERPRINT: ${{ steps.fingerprints.outputs.mesa_testing }}
          LIB32_MESA_TESTING_FINGERPRINT: ${{ steps.fingerprints.outputs.lib32_mesa_testing }}
          BC250_DUAL_AUDIO_FINGERPRINT: ${{ steps.fingerprints.outputs.bc250_dual_audio }}
          LINUX_CACHYOS_BC250_META_FINGERPRINT: ${{ steps.fingerprints.outputs.linux_cachyos_bc250_meta }}
          NCT6687D_COMMIT: ${{ steps.nct6687d.outputs.commit }}
          CACHYOS_MESA_COMMIT: ${{ steps.mesa_packaging.outputs.commit }}
          MESA_GIT_COMMIT: ${{ steps.mesa_git.outputs.commit }}
          BUILD_KERNEL_STABLE: ${{ steps.build.outputs.kernel_stable }}
          BUILD_KERNEL_RC: ${{ steps.build.outputs.kernel_rc }}
          BUILD_KERNEL_BORE: ${{ steps.build.outputs.kernel_bore }}
          BUILD_MESA: ${{ steps.build.outputs.mesa }}
          BUILD_LIB32_MESA: ${{ steps.build.outputs.lib32_mesa }}
          BUILD_MESA_GIT: ${{ steps.build.outputs.mesa_git }}
          BUILD_MESA_TESTING: ${{ steps.build.outputs.mesa_testing }}
          BUILD_LIB32_MESA_TESTING: ${{ steps.build.outputs.lib32_mesa_testing }}
          BUILD_BC250_DUAL_AUDIO: ${{ steps.build.outputs.bc250_dual_audio }}
          BUILD_LINUX_CACHYOS_BC250_META: ${{ steps.build.outputs.linux_cachyos_bc250_meta }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --security-opt label=disable \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v bc250-ccache:/ccache \
            -w /workspace \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE=30G \
            -e CCACHE_COMPILERCHECK=content \
            -e BUILD_KERNEL_STABLE \
            -e BUILD_KERNEL_RC \
            -e BUILD_KERNEL_BORE \
            -e BUILD_MESA \
            -e BUILD_LIB32_MESA \
            -e BUILD_MESA_GIT \
            -e BUILD_MESA_TESTING \
            -e BUILD_LIB32_MESA_TESTING \
            -e BUILD_BC250_DUAL_AUDIO \
            -e BUILD_LINUX_CACHYOS_BC250_META \
            -e BC250_PKGREL='${{ github.run_number }}' \
            -e SOURCE_FINGERPRINT \
            -e KERNEL_STABLE_FINGERPRINT \
            -e KERNEL_RC_FINGERPRINT \
            -e KERNEL_BORE_FINGERPRINT \
            -e MESA_FINGERPRINT \
            -e LIB32_MESA_FINGERPRINT \
            -e MESA_GIT_FINGERPRINT \
            -e MESA_TESTING_FINGERPRINT \
            -e LIB32_MESA_TESTING_FINGERPRINT \
            -e BC250_DUAL_AUDIO_FINGERPRINT \
            -e LINUX_CACHYOS_BC250_META_FINGERPRINT \
            -e NCT6687D_COMMIT \
            -e CACHYOS_MESA_COMMIT \
            -e MESA_GIT_COMMIT \
            -e GITHUB_REPOSITORY='${{ github.repository }}' \
            -e GITHUB_SHA='${{ github.sha }}' \
            archlinux:base-devel \
            bash /workspace/scripts/ci-build.sh

      - name: Restore workspace ownership
        # Always runs, even if the build above failed, so a container-root-owned
        # workspace never gets left behind to break the next run's checkout.
        if: always() && steps.build.outputs.any == 'true'
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Preserve workflow artifact
        if: steps.build.outputs.any == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bc250-cachyos-repo-${{ github.run_number }}
          path: out/repo/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true

      - name: Publish pacman repository release
        if: steps.build.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=out/repo
          title="$(cat "$out/release-title.txt")"

          required=(
            release-title.txt RELEASE_NOTES.md SHA256SUMS build-info.env
            kernel-stable-info.env kernel-rc-info.env kernel-bore-info.env
            kernel-stable-PKGBUILD kernel-stable.SRCINFO kernel-stable-config
            kernel-rc-PKGBUILD kernel-rc.SRCINFO kernel-rc-config
            kernel-bore-PKGBUILD kernel-bore.SRCINFO kernel-bore-config
            nct6687.c
            mesa-info.env lib32-mesa-info.env mesa-git-info.env
            mesa-testing-info.env lib32-mesa-testing-info.env
            bc250-dual-audio-info.env
            linux-cachyos-bc250-meta-info.env
            bc250-cachyos.db bc250-cachyos.db.tar.zst
            bc250-cachyos.files bc250-cachyos.files.tar.zst
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$out/$file" ]]; then
              echo "::error title=Incomplete release staging::Missing required asset: $out/$file"
              exit 1
            fi
          done

          mapfile -d '' -t assets < <(
            find "$out" -maxdepth 1 -type f -print0 | sort -z
          )
          (( ${#assets[@]} > 0 )) || {
            echo "::error title=Empty release staging::No release assets found in $out"
            exit 1
          }

          printf 'Publishing %d release assets.\n' "${#assets[@]}"

          if gh release view repo >/dev/null 2>&1; then
            gh release delete repo --yes --cleanup-tag
            sleep 2
          fi

          gh release create repo \
            --target '${{ github.sha }}' \
            --title "$title" \
            --notes-file "$out/RELEASE_NOTES.md" \
            --latest=false \
            "${assets[@]}"
