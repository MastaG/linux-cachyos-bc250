name: Build and publish BC-250 CachyOS kernel and Mesa

on:
  workflow_dispatch:
    inputs:
      source:
        description: Upstream CachyOS package used as source
        required: true
        default: auto
        type: choice
        options:
          - auto
          - rc
          - stable
      force:
        description: Rebuild even when the source fingerprint is unchanged
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '23 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-release.yml'
      - 'patches/**'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: bc250-kernel-release
  cancel-in-progress: false

jobs:
  build:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - bc250

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select upstream source package
        id: source
        shell: bash
        env:
          CONFIGURED_SOURCE: ${{ vars.CACHYOS_SOURCE_VARIANT }}
          DISPATCH_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail

          selection="${CONFIGURED_SOURCE:-linux-cachyos-rc}"
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' && "${DISPATCH_SOURCE:-auto}" != auto ]]; then
            selection="$DISPATCH_SOURCE"
          fi

          case "$selection" in
            rc|linux-cachyos-rc)
              variant=linux-cachyos-rc
              ;;
            stable|linux-cachyos)
              variant=linux-cachyos
              ;;
            *)
              echo "Unsupported source selection: $selection" >&2
              exit 1
              ;;
          esac

          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "Using upstream source package: $variant"

      - name: Guard RC kernel generation
        id: kernel
        shell: bash
        run: |
          set -euo pipefail

          variant='${{ steps.source.outputs.variant }}'
          build=true
          reason=none

          if [[ "$variant" == linux-cachyos-rc ]]; then
            pkgbuild_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-rc/PKGBUILD"
            pkgbuild="$(curl -fsSL --retry 5 --retry-all-errors "$pkgbuild_url")"
            rc_major="$(sed -nE 's/^_major=([0-9]+\.[0-9]+).*$/\1/p' <<<"$pkgbuild" | head -n1)"

            if [[ -z "$rc_major" ]]; then
              echo "ERROR: could not determine _major from linux-cachyos-rc/PKGBUILD" >&2
              exit 1
            fi

            echo "linux-cachyos-rc _major: $rc_major"

            if [[ "$(printf '%s\n' '7.3' "$rc_major" | sort -V | head -n1)" == '7.3' ]]; then
              build=false
              reason="linux-cachyos-rc is ${rc_major} (7.3 or newer)"
              echo "::warning title=BC-250 kernel build paused::${reason}. Keep the last 7.2 kernel packages and switch CACHYOS_SOURCE_VARIANT to linux-cachyos before building the kernel again."
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Kernel build enabled: $build"

      - name: Resolve nct6687d source
        if: steps.kernel.outputs.build == 'true'
        id: nct6687d
        shell: bash
        env:
          NCT6687D_REF: ${{ vars.NCT6687D_REF }}
        run: |
          set -euo pipefail
          commit="$(./scripts/resolve-nct6687d.sh)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Using nct6687d commit: $commit"

      - name: Resolve CachyOS Mesa source
        id: mesa
        shell: bash
        env:
          CACHYOS_MESA_REF: ${{ vars.CACHYOS_MESA_REF }}
        run: |
          set -euo pipefail
          commit="$(./scripts/resolve-cachyos-mesa.sh)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Using CachyOS Mesa commit: $commit"

      - name: Calculate source fingerprint
        id: fingerprint
        shell: bash
        env:
          NCT6687D_COMMIT: ${{ steps.nct6687d.outputs.commit }}
          CACHYOS_MESA_COMMIT: ${{ steps.mesa.outputs.commit }}
        run: |
          set -euo pipefail
          fingerprint="$(./scripts/source-fingerprint.sh '${{ steps.source.outputs.variant }}' '${{ steps.kernel.outputs.build }}')"
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Source fingerprint: $fingerprint"

      - name: Check published repository
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          build=true
          mkdir -p previous

          if gh release download repo \
              --pattern build-info.env --dir previous >/dev/null 2>&1; then
            previous_fingerprint="$(sed -n 's/^SOURCE_FINGERPRINT=//p' previous/build-info.env | head -n1)"
            if [[ "$previous_fingerprint" == "$SOURCE_FINGERPRINT" ]]; then
              build=false
            fi
          fi

          if [[ '${{ github.event_name }}' == 'workflow_dispatch' && '${{ inputs.force }}' == 'true' ]]; then
            build=true
          fi
          if [[ '${{ github.event_name }}' == 'push' ]]; then
            build=true
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build required: $build"

      - name: Seed previous repository for Mesa-only build
        if: steps.existing.outputs.build == 'true' && steps.kernel.outputs.build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/repo
          mkdir -p out/repo

          if ! gh release download repo --dir out/repo; then
            echo "::error title=Cannot preserve kernel packages::The RC kernel guard is active, but no previous repo release could be downloaded. Switch CACHYOS_SOURCE_VARIANT to linux-cachyos and run the workflow again."
            exit 1
          fi

          kernel_pkg="$(find out/repo -maxdepth 1 -type f \
            -name 'linux-cachyos-bc250-*.pkg.tar.zst' \
            ! -name 'linux-cachyos-bc250-headers-*.pkg.tar.zst' \
            -print -quit)"
          headers_pkg="$(find out/repo -maxdepth 1 -type f \
            -name 'linux-cachyos-bc250-headers-*.pkg.tar.zst' \
            -print -quit)"

          if [[ -z "$kernel_pkg" || -z "$headers_pkg" || ! -f out/repo/build-info.env || ! -f out/repo/RELEASE_NOTES.md ]]; then
            echo "::error title=Incomplete previous release::Cannot do a Mesa-only publication without retaining the previous kernel, headers, and metadata."
            exit 1
          fi

          echo "Kernel build is paused; retaining $(basename "$kernel_pkg") and $(basename "$headers_pkg")."

      - name: Build Zen 2-tuned packages and repository
        if: steps.existing.outputs.build == 'true'
        env:
          SOURCE_FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
          NCT6687D_COMMIT: ${{ steps.nct6687d.outputs.commit }}
          CACHYOS_MESA_COMMIT: ${{ steps.mesa.outputs.commit }}
          BUILD_KERNEL: ${{ steps.kernel.outputs.build }}
          KERNEL_GUARD_REASON: ${{ steps.kernel.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --security-opt label=disable \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e CACHYOS_SOURCE_VARIANT='${{ steps.source.outputs.variant }}' \
            -e BUILD_KERNEL \
            -e KERNEL_GUARD_REASON \
            -e BC250_PKGREL='${{ github.run_number }}' \
            -e SOURCE_FINGERPRINT \
            -e NCT6687D_COMMIT \
            -e CACHYOS_MESA_COMMIT \
            -e GITHUB_REPOSITORY='${{ github.repository }}' \
            -e GITHUB_SHA='${{ github.sha }}' \
            archlinux:base-devel \
            bash /workspace/scripts/ci-build.sh

          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Preserve workflow artifact
        if: steps.existing.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bc250-cachyos-repo-${{ github.run_number }}
          path: out/repo/
          if-no-files-found: error
          retention-days: 14

      - name: Publish pacman repository release
        if: steps.existing.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=out/repo
          title="$(cat "$out/release-title.txt")"

          if gh release view repo >/dev/null 2>&1; then
            gh release delete repo --yes --cleanup-tag
            sleep 2
          fi

          gh release create repo \
            --target '${{ github.sha }}' \
            --title "$title" \
            --notes-file "$out/RELEASE_NOTES.md" \
            --latest=false \
            "$out"/* "$out"/.SRCINFO
