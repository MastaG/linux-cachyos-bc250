name: FSR4 packaging checks

on:
  push:
    paths: ['scripts/**', 'packages/**', 'patches/mesa*/**', 'tests/**', '.github/workflows/fsr4-checks.yml']
  pull_request:
    paths: ['scripts/**', 'packages/**', 'patches/mesa*/**', 'tests/**', '.github/workflows/fsr4-checks.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      # Only bsdtar is needed, and only from Ubuntu's own archive. The runner
      # image also carries third-party lists (Chrome, Microsoft), and when one
      # of those publishes an inconsistent index every job here goes red for a
      # reason that has nothing to do with this repository -- apt exits 100
      # even though it says the failed indexes "have been ignored". Let the
      # install be the gate instead: it fails if the package is really missing.
      - run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y libarchive-tools
      - run: python3 -B -m unittest discover -s tests -v
