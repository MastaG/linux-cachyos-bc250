name: FSR4 packaging checks

on:
  push:
    paths: ['scripts/**', 'packages/**', 'patches/mesa*/**', 'tests/**', '.github/workflows/fsr4-checks.yml']
  pull_request:
    paths: ['scripts/**', 'packages/**', 'patches/mesa*/**', 'tests/**', '.github/workflows/fsr4-checks.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      # Only bsdtar is needed, and only from Ubuntu's own archive. The runner
      # image also carries Chrome's and Microsoft's repositories, and when one
      # of them publishes an index that does not match its Release file, apt
      # exits 100 and every job here goes red for a reason that has nothing to
      # do with this repository. Drop those rather than ignore the exit code,
      # so a real failure to reach Ubuntu's archive still fails the job.
      #
      # Selected by the host they point at, not by filename: the image has used
      # .list and .sources, and several names, across releases. Ubuntu's own
      # configuration names none of these hosts, so it cannot be caught.
      - run: |
          third_party=$(sudo grep -rlE 'dl\.google\.com|packages\.microsoft\.com' \
              /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -n "$third_party" ]; then
            printf 'dropping third-party apt sources:\n%s\n' "$third_party"
            printf '%s\n' "$third_party" | sudo xargs -r rm -f
          fi
          sudo apt-get update -qq
          sudo apt-get install -y libarchive-tools
      - run: python3 -B -m unittest discover -s tests -v
