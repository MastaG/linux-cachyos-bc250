name: FSR4 packaging checks

on:
  push:
    paths: ['scripts/**', 'packages/**', 'patches/mesa*/**', 'tests/**', '.github/workflows/fsr4-checks.yml']
  pull_request:
    paths: ['scripts/**', 'packages/**', 'patches/mesa*/**', 'tests/**', '.github/workflows/fsr4-checks.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      # Only bsdtar is needed, and only from Ubuntu's own archive. The runner
      # image also carries Chrome's and Microsoft's lists, and when one of them
      # publishes an index that does not match its Release file, apt exits 100
      # and every job here goes red for a reason that has nothing to do with
      # this repository. Drop those two rather than ignore the exit code, so a
      # real failure to reach Ubuntu's archive still fails the job. Neither
      # glob can match ubuntu.sources, which is where the archive we do use is
      # configured on the 24.04 image.
      - run: |
          sudo rm -f /etc/apt/sources.list.d/google*.list \
                     /etc/apt/sources.list.d/microsoft*.list
          sudo apt-get update -qq
          sudo apt-get install -y libarchive-tools
      - run: python3 -B -m unittest discover -s tests -v
