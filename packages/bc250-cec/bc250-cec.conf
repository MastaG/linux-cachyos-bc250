# bc250-cec runtime configuration.
#
# Parsed by systemd itself (EnvironmentFile= in bc250-cec.service), not
# sourced as a shell script: plain KEY=value lines only, no command
# substitution, no shell expansion. Uncomment a line to override that
# default; anything left commented out keeps the daemon's built-in
# default. Restart the service to pick up a change:
#   sudo systemctl restart bc250-cec.service

# The name this board reports to the HDMI CEC bus.
#BC250_CEC_DISPLAY_NAME=SteamOS

# Replug the HDMI link when the display reports powering on.
#BC250_CEC_HOTPLUG_ON_POWER_ON=1

# Replug the HDMI link when another device (TV or AVR) switches its
# active input to this board while the display itself never went to
# standby.
#BC250_CEC_HOTPLUG_ON_ACTIVE_SOURCE=1

# Inject a synthetic keypress after a power-on replug, to clear Steam's
# own black-screen-instead-of-screensaver UI quirk. Set to 0 to disable
# just the keypress while keeping the replug.
#BC250_CEC_WAKE_KEY_ON_POWER_ON=1

# Same, after an active-source replug.
#BC250_CEC_WAKE_KEY_ON_ACTIVE_SOURCE=1

# The evdev KEY_* name to inject. F15 by default: not present on
# physical keyboards at all, and essentially never bound to anything in
# a game or in Steam's own UI. Leave empty to disable the wake keypress
# entirely regardless of the two settings above.
#BC250_CEC_WAKE_KEY=KEY_F15

# Seconds to wait after a replug before injecting the keypress.
#BC250_CEC_WAKE_DELAY_S=1

# How often (seconds) to poll the display's power status.
#BC250_CEC_POLL_INTERVAL_S=5

# Minimum seconds between replugs, shared across both trigger sources.
#BC250_CEC_TRIGGER_COOLDOWN_S=30

# Broadcast <Active Source> after a power-on, so the TV switches its input
# to this board on its own, and also ask the AVR to route its audio from
# this board (<System Audio Mode Request> -- without this, an AVR can
# switch picture but leave its own audio selector on "TV Audio", the same
# as it does for a native TV app). Off by default: this is the one thing
# the daemon otherwise never does -- everything else is detect-and-react
# only, never a command that could change what's on screen or playing.
# Only applies to the power-on trigger; switching again after the TV
# already switched to us (the active-source trigger) would be pointless.
#BC250_CEC_SWITCH_INPUT_ON_POWER_ON=0

# Seconds after a power-on replug to wait before switching the input, so
# it doesn't race the replug and the display's own post-power-on settling.
#BC250_CEC_SWITCH_INPUT_DELAY_S=3

# Run your own script on a genuine display power-on/power-off (e.g. smart
# home integration, muting something, anything else scriptable). Must be
# the full path to an executable file -- this is parsed by systemd as
# plain KEY=value, not a shell command line, so it takes no arguments or
# quoting of its own; put whatever logic you need inside the script.
# It runs as root, same as the rest of this service, and in the
# background, so a slow script never blocks CEC detection. Its own
# output lands in `journalctl -u bc250-cec` alongside this service's own
# log lines. The command always comes from this file, never from
# anything received over CEC -- nothing on the CEC bus can influence
# what runs, only whether it does.
#BC250_CEC_ON_POWER_ON_COMMAND=/usr/local/bin/bc250-cec-on-power-on.sh
#BC250_CEC_ON_POWER_OFF_COMMAND=/usr/local/bin/bc250-cec-on-power-off.sh
